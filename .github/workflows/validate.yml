name: Validate teaching materials
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  content-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: python -m pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Read-only textbook and course checks
        run: |
          python ap-calculus-ab/scripts/validate_content.py --check
          python instagram/scripts/validate.py --complete --exports
          python -m unittest discover -s tests -v
          pnpm test:layout
          git diff --exit-code
      - name: Rebuild first lesson from a clean source copy
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/ap-calculus-smoke"
          mkdir -p "$smoke_dir"
          git archive HEAD | tar -x -C "$smoke_dir"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$smoke_dir/node_modules"
          rm -rf "$smoke_dir/instagram/exports" "$smoke_dir/instagram/assets"
          cd "$smoke_dir"
          python instagram/scripts/build.py --lessons L01
          node instagram/scripts/render.mjs --lessons L01
          python instagram/scripts/validate.py --lessons L01 --exports
